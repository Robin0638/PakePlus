<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>游戏加载中…</title>
  <meta http-equiv="refresh" content="3;url=gomoku_game (1).html">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    /* 禁止选择文本 */
    html, body {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    body{
      height:100vh;
      background:#000;
      color:#fff;
      font-family:"Microsoft YaHei",sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding:20vh 0 10vh;
    }
    .spinner{
      width:60px;height:60px;
      border:4px solid rgba(255,255,255,.1);
      border-top-color:#667eea;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }
    .rules{
      max-width:600px;
      text-align:center;
      font-size:14px;
      line-height:1.8;
      color:#aaa;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    // 禁止复制功能
    document.addEventListener('copy', function(e) {
      e.preventDefault();
      return false;
    });
    
    // 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
  </script>
</head>
<body>
  <div class="spinner"></div>

  <div class="rules">
    <p>抵制不良游戏，拒绝盗版游戏。</p>
    <p>注意自我保护，谨防受骗上当。</p>
    <p>适度游戏益脑，沉迷游戏伤身。</p>
    <p>合理安排时间，享受健康生活。</p>
  </div>
</body>
