<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Logo</title>
  <style>
    html,body{margin:0;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
      /* 禁止选择文本 */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    .logo{
      width:200px;height:200px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:20px;
      pointer-events: none; /* 禁止鼠标事件 */
      cursor: default; /* 默认鼠标样式 */
    }
    /* 移除悬停效果 */
    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .info{
      color:#fff;
      text-align:center;
      font-family:"Microsoft YaHei",sans-serif;
      margin-top:20px;
    }
    .info .version{
      font-size:14px;
      opacity:0.8;
    }
    .info .about{
      font-size:12px;
      opacity:0.6;
      margin-top:5px;
    }
  </style>
  <meta http-equiv="refresh" content="2;url=gongyue.html">
  <script>
    // 禁止复制功能
    document.addEventListener('copy', function(e) {
      e.preventDefault();
      return false;
    });
    
    // 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
    
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
      // 获取logo元素
      const logo = document.querySelector('.logo');
      
      // 阻止logo的点击事件
      logo.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      });
    });
  </script>
</head>
<body>
  <div class="logo">
    <img src="png/IMG_20250806_201207.png" alt="Logo">
  </div>
  <div class="info">
    <div class="version">版本号: v1.0.0</div>
    <div class="about">布吉岛与我不造&Robin1</div>
  </div>
</body>
</html>
