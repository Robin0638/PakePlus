<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有数规划（电脑版）专注时钟</title>
    <link rel="stylesheet" href="css/pomodoro.css">
    <link rel="stylesheet" href="css/pomodorodark.css">
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme">
    <!-- 头部用户信息 -->
    <header class="user-header">
        <div class="user-info">
            <div class="user-avatar-container">
                <img id="user-avatar" class="user-avatar" src="img/1.png" alt="用户头像">
            </div>
            <div class="user-details">
                <span id="user-nickname" class="user-nickname">未登录</span>
                <div class="points-info">
                    <span class="points-icon star-icon"><i class="fas fa-star"></i></span>
                    <span id="user-points">0</span>
                </div>
            </div>
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i>
            返回最近要做
        </button>
    </header>

    <div class="container">
        <!-- 侧边栏 (桌面端) -->
        <div class="sidebar">
            <h2><i class="fas fa-stopwatch" style="color:#ff6347;margin-right:8px;"></i>有数规划（电脑版）专注时钟</h2>
            
            <!-- 添加事件表单 -->
            <div class="event-form">
                <h3 style="margin-bottom: 15px; color: #667eea;">添加新事件</h3>
                <div class="form-group">
                    <label>事件名称</label>
                    <input type="text" id="eventName" placeholder="输入事件名称">
                </div>
                <div class="form-group">
                    <label>专注时长 (分钟)</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="eventDuration" style="flex: 1;">
                            <option value="25">25分钟</option>
                            <option value="30">30分钟</option>
                            <option value="45">45分钟</option>
                            <option value="60">60分钟</option>
                            <option value="custom">自定义时长</option>
                        </select>
                        <input type="number" id="customDuration" placeholder="自定义分钟" style="display: none; width: 120px;" min="1" max="180">
                    </div>
                </div>
                <button class="btn" onclick="addEvent()" style="width: 100%;">添加事件</button>
            </div>

            <!-- 事件列表 -->
            <div class="event-list" id="eventList">
                <!-- 动态生成 -->
            </div>

            <!-- 统计信息 -->
            <div class="stats">
                <h3>今日统计</h3>   
                <div class="stat-item"> 
                     <span><i class="fas fa-list-check" style="color:#667eea;"></i> 当前事件:</span>
                     <span id="currentEventName">无</span>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-check-circle" style="color:#ff6347;"></i> 今日完成:</span>
                    <span id="completedPomodoros">0</span>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-fire" style="color:#ff9800;"></i> 专注时长:</span>
                    <span id="totalTime">0分钟</span>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-bullseye" style="color:#4caf50;"></i> 今日目标:</span>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span id="dailyTarget">0分钟</span>
                        <button class="btn btn-small" onclick="setDailyTarget()"><i class="fas fa-pen"></i> 设置</button>
                    </div>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-trophy" style="color:#ffd700;"></i> 目标达成率:</span>
                    <span id="targetCompletionRate">0%</span>
                </div>

                <h3>总统计</h3>
                <div class="stat-item">
                    <span><i class="fas fa-apple-whole" style="color:#ff6347;"></i> 总番茄数:</span>
                    <span id="totalPomodoros">0</span>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-award" style="color:#ffd700;"></i> 总目标达成率:</span>
                    <span id="totalCompletionRate">0%</span>
                </div>
                <div class="stat-item">
                    <span><i class="fas fa-fire" style="color:#ff9800;"></i> 总专注时长:</span>
                    <span id="totalFocusTime">0分钟</span>
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="data-management">
                <h3 style="color: #667eea; margin-bottom: 15px;">专注时钟数据管理</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn secondary" onclick="showEventStats()" style="width: 100%;">
                        📊 查看详细统计
                    </button>
                    <button class="btn secondary" onclick="showDailyStats()" style="width: 100%;">
                        📅 查看每日统计
                    </button>
                    <button class="btn secondary" onclick="exportData()" style="width: 100%;">
                        📥 导出数据
                    </button>
                    <div style="position: relative;">
                        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                        <button class="btn secondary" onclick="document.getElementById('importFile').click()" style="width: 100%;">
                            📤 导入数据
                        </button>
                    </div>
                </div>
            </div>
            <div class="sidebar-resizer"></div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <div class="timer-container">
                <div class="timer-label" id="timerLabel">
                    <i class="fas fa-stopwatch" style="color:#ff6347;margin-right:8px;"></i>准备开始专注
                </div>
                
                <!-- 进度环 -->
                <svg class="progress-ring" width="200" height="200">
                    <circle class="progress-ring-circle" cx="100" cy="100" r="90" 
                            stroke-dasharray="565.48" stroke-dashoffset="565.48" id="progressCircle">
                    </circle>
                </svg>
                
                <div class="timer-display" id="timerDisplay">25:00</div>
                
                <div class="current-event" id="currentEvent" style="display: none;">
                    <i class="fas fa-list-check" style="color:#667eea;margin-right:4px;"></i>当前事件: <span id="currentEventDisplay">无</span>
                </div>

                <div>
                    <button class="btn" id="startBtn" onclick="startTimer()">
                        <i class="fas fa-play"></i> 开始
                    </button>
                    <button class="btn secondary" id="pauseBtn" onclick="pauseTimer()" style="display: none;">
                        <i class="fas fa-pause"></i> 暂停
                    </button>
                    <button class="btn secondary" onclick="resetTimer()">
                        <i class="fas fa-rotate-left"></i> 重置
                    </button>
                    <button class="btn success" onclick="completePomodoro()" id="completeBtn" style="display: none;">
                        <i class="fas fa-check"></i> 完成
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端导航栏 -->
    <div class="mobile-nav">
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showMobileSection('timer')">
                <i class="fas fa-stopwatch"></i> 计时器
            </button>
            <button class="nav-btn" onclick="showMobileSection('events')">
                <i class="fas fa-calendar-plus"></i> 事件管理
            </button>
            <button class="nav-btn" onclick="showMobileSection('stats')">
                <i class="fas fa-chart-bar"></i> 统计
            </button>
        </div>
    </div>

    <!-- 移动端模态框 -->
    <div class="mobile-modal" id="mobileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-calendar-plus" style="margin-right:6px;"></i>事件管理</h3>
                <button class="close-btn" onclick="closeMobileModal()">&times;</button>
            </div>
            <div id="modalContent">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 专注模式悬浮指示器 -->
    <div class="focus-floating-indicator" id="focus-floating-indicator" onclick="openPomodoroTracker()">
        <i class="fas fa-hourglass-half"></i>
        <span class="focus-floating-text">专注进行中</span>
        <span class="timer-mini" id="floating-timer"><i class="fas fa-stopwatch"></i> 25:00</span>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/pomodoro.js"></script>
    <script>
        // 主题管理函数 - 从storage.js获取设置，与主应用保持一致
        function updateThemeFromSettings() {
            if (!window.StorageManager) {
                console.warn('StorageManager not available, using default theme');
                return;
            }
            
            const settings = StorageManager.getSettings();
            const theme = settings.theme || 'system';
            
            // 移除所有主题类
            document.body.classList.remove('light-theme', 'dark-theme', 'dark-mode');
            
            // 根据设置应用主题
            if (theme === 'dark') {
                document.body.classList.add('dark-theme', 'dark-mode');
            } else if (theme === 'light') {
                document.body.classList.add('light-theme');
            } else if (theme === 'auto' || theme === 'system') {
                // 自动模式：根据时间判断
                const currentHour = new Date().getHours();
                const isDarkMode = currentHour >= 18 || currentHour < 6;
                
                if (isDarkMode) {
                    document.body.classList.add('dark-theme', 'dark-mode');
                } else {
                    document.body.classList.add('light-theme');
                }
            }
            
            // 设置HTML元素的data属性，便于CSS选择器使用
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
        }

        // 监听主题变化和用户信息变化
        function setupThemeListener() {
            // 监听storage变化
            window.addEventListener('storage', function(e) {
                if (e.key === 'schedule_app_data' || e.key === 'userNickname' || e.key === 'userAvatar') {
                    updateThemeFromSettings();
                    loadUserInfo(); // 同时更新用户信息
                }
            });
            
            // 监听主题变化事件（来自主应用）
            document.addEventListener('themechange', function(e) {
                const theme = e.detail.theme;
                document.body.classList.remove('light-theme', 'dark-theme', 'dark-mode');
                if (theme === 'dark') {
                    document.body.classList.add('dark-theme', 'dark-mode');
                } else {
                    document.body.classList.add('light-theme');
                }
                document.documentElement.setAttribute('data-theme', theme);
            });
            
            // 监听用户信息更新事件
            document.addEventListener('userInfoUpdate', function() {
                loadUserInfo();
            });
            
            // 监听用户登录状态变化事件
            window.addEventListener('userLoginStateChanged', function(e) {
                loadUserInfo();
            });
            
            // 定期检查主题设置和用户信息（以防其他页面修改了设置）
            setInterval(function() {
                updateThemeFromSettings();
                loadUserInfo();
            }, 30000); // 每30秒检查一次
        }

        // 加载用户信息
        function loadUserInfo() {
            if (!window.StorageManager) {
                console.warn('StorageManager not available');
                return;
            }
            
            // 从localStorage获取当前登录的昵称和头像
            const currentNickname = localStorage.getItem('userNickname') || '未登录';
            const currentAvatar = localStorage.getItem('userAvatar');
            const points = StorageManager.getPoints();
            
            // 更新用户昵称
            const nicknameElement = document.getElementById('user-nickname');
            if (nicknameElement) {
                nicknameElement.textContent = currentNickname;
            }
            
            // 更新用户头像
            const avatarElement = document.getElementById('user-avatar');
            if (avatarElement) {
                let avatarSrc = currentAvatar;
                // 如果头像为空，使用默认头像
                if (!avatarSrc) {
                    avatarSrc = 'img/1.png';
                }
                avatarElement.src = avatarSrc;
                
                // 处理头像加载失败的情况
                avatarElement.onerror = function() {
                    this.src = 'img/1.png';
                };
            }
            
            // 更新积分
            const pointsElement = document.getElementById('user-points');
            if (pointsElement) {
                const pointsValue = points || 0;
                pointsElement.textContent = pointsValue;
            }
        }
        
        // 立即初始化主题和用户信息（不等待DOMContentLoaded）
        updateThemeFromSettings();
        
        // 尝试立即加载用户信息
        setTimeout(loadUserInfo, 100); // 延迟100ms确保DOM已加载
        
        // 页面加载完成后设置监听器
        document.addEventListener('DOMContentLoaded', function() {
            setupThemeListener();
            loadUserInfo(); // 再次加载用户信息确保正确显示
        });

        /**
         * 通用文件下载方法，兼容HBuilderX打包和浏览器
         * @param {string} url 下载链接
         * @param {string} filename 保存文件名（可选）
         */
        function downloadFile(url, filename) {
            if (window.plus) {
                // 申请存储权限
                plus.android.requestPermissions(
                    ["android.permission.WRITE_EXTERNAL_STORAGE"],
                    function(e) {
                        // 权限申请成功
                        let dtask = plus.downloader.createDownload(url, {
                            filename: "_downloads/" + (filename || url.split('/').pop())
                        }, function(d, status) {
                            if (status == 200) {
                                plus.nativeUI.toast("下载成功：" + d.filename);
                                // 下载完成后自动打开文件
                                plus.runtime.openFile(d.filename);
                            } else {
                                plus.nativeUI.toast("下载失败");
                            }
                        });
                        dtask.start();
                    },
                    function(e) {
                        plus.nativeUI.toast("未获得存储权限，无法下载");
                    }
                );
            } else {
                // 浏览器环境，降级处理
                fetch(url)
                    .then(res => res.blob())
                    .then(blob => {
                        const a = document.createElement('a');
                        a.href = window.URL.createObjectURL(blob);
                        a.download = filename || url.split('/').pop();
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(a.href);
                    })
                    .catch(() => {
                        window.open(url, '_blank');
                    });
            }
        }
    </script>
    <script>
    // 侧边栏宽度拖拽功能（仅桌面端）
    (function() {
        const sidebar = document.querySelector('.sidebar');
        const resizer = document.querySelector('.sidebar-resizer');
        const mainContent = document.querySelector('.main-content');
        if (!sidebar || !resizer) return;
        let isDragging = false;
        let startX = 0;
        let startWidth = 0;
        const minWidth = 260;
        const maxWidth = 800;
        // 页面加载时恢复宽度
        if (window.innerWidth >= 1024) {
            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) {
                sidebar.style.width = savedWidth + 'px';
                if (mainContent) {
                    mainContent.style.width = `calc(100% - ${savedWidth}px)`;
                }
            }
        }
        resizer.addEventListener('mousedown', function(e) {
            if (window.innerWidth < 1024) return;
            isDragging = true;
            startX = e.clientX;
            startWidth = sidebar.offsetWidth;
            document.body.style.cursor = 'ew-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            let newWidth = startWidth + (e.clientX - startX);
            newWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));
            sidebar.style.width = newWidth + 'px';
            if (mainContent) {
                mainContent.style.width = `calc(100% - ${newWidth}px)`;
            }
            // 拖动时实时保存宽度
            localStorage.setItem('sidebarWidth', newWidth);
        });
        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });
    })();
    </script>
</body>
</html>
